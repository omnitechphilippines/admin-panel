<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <script>
    // Preserve the original path+query+hash
    const originalPath = location.pathname + location.search + location.hash;
    // Build the URL that points to index.html and keeps the original path
    const target = originalPath !== '/' ? originalPath : '';
    // Use replace() so the browser history does NOT contain the 404 page
    location.replace(target);
  </script>
  <!-- Fallback for very old browsers -->
  <noscript>
    <meta http-equiv="refresh" content="0; url=/index.html">
  </noscript>
</head>
<body></body>
</html>
